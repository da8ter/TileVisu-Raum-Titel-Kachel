    <style>
        /* Ich passe margin vom Body an und überschreibe somit das Standardpadding der Darstellung zu den Seiten */

        :root {
            --background-image: #000000;
        }

        body {
            margin: 0px;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: var(--tilebackgroundcolor);

        }

        .hidden {
            display: none;
        }

        .maindiv2 {
            width: 100%;
            height: 90%;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .maindiv1 {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: flex-start;
            align-content: flex-start;
            box-sizing: border-box;
            padding: 0px 0px 0px 0px;
        }


        .maindiv1:before {
            content: " ";
            display: block;
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: var(--imagetransparency);
            background: var(--background-image, none) bottom / cover no-repeat;
            background-repeat: no-repeat;
            background-size: cover;

        }

        .maindiv1>* {
            position: relative;
            z-index: 1;
        }

        .left-aligned {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-end;
            /* Inhalt nach links ausrichten */
            text-align: left;
            /* Text linksbündig */
            padding: 0px 0px 10px 0px;
            width: 20%;
            height: 100%;
            padding-left: 20px;
            box-sizing: border-box;
        }

        .left-aligned2 {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            /* Inhalt nach links ausrichten */
            text-align: left;
            /* Text linksbündig */
            padding: 0px 0px 10px 0px;

            padding-right: 30px;
            box-sizing: border-box;
        }

        .center-aligned {
            display: flex;
            justify-content: center;
            align-items: center;
            /* Inhalt zentrieren (horizontal und vertikal) */
            padding: 0px 0px 0px 0px;
            width: 60%;
            height: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .right-aligned {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: flex-end;
            /* Inhalt nach rechts ausrichten */
            text-align: right;
            /* Text rechtsbündig */
            padding: 0px 0px 10px 0px;
            width: 20%;
            height: 100%;
            padding-right: 20px;
            box-sizing: border-box;
        }

        .right-aligned2 {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            /* Inhalt nach rechts ausrichten */
            text-align: right;
            /* Text rechtsbündig */
            padding: 0px 0px 10px 0px;
            padding-left: 30px;
            box-sizing: border-box;
        }

        .menubar {
            backdrop-filter: blur(10px) brightness(1);
            -webkit-backdrop-filter: blur(10px) brightness(1);
            background-color: var(--menubackgroundcolor);
            width: 100%;

            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 5px;
            padding-bottom: 5px;
            box-sizing: border-box;
            border-top: 0px dotted #28cdab;

        }

        .menubarlinks {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;

            padding: 0px;
            text-align: left;
            height: 100%;
            box-sizing: border-box;
        }

        .menubarrechts {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-end;

            text-align: right;
            height: 100%;
            box-sizing: border-box;

        }



        .infoleft,
        .inforight,
        .infoleftasso,
        .inforightasso,
        .infoleftname,
        .inforightname {

            color: var(--infofontcolor);
            opacity: 1;
            white-space: nowrap;
        }

            white-space: nowrap;
        }

        .info2asso,

        .switch3name,
        .switch4name,
        .switch5name,

        .switch2asso,
        .switch3asso,
        .switch4asso,

            padding-right: 1px;
            padding-left: 1px;
            white-space: nowrap;
        }

        .infoicon,
        .switchicon {
            color: #ffffff;
            font-size: calc(var(--menufontsize) * 0.7);
            opacity: 1;
        }

        .infotrenner,
        .infotrennerstart,
        .infolefttrenner {
            height: 60%;
            width: 1px;
            background-color: #28CDAB;
            margin-right: 10px;
            margin-left: 10px;
            opacity: 0.3;
            overflow: visible;
            z-index: 10;
        }

        .infotrennerstart {
            margin-left: 0px;
        }


        .roomname {
            font-size: var(--roomnamefontsize);
            color: var(--roomnamefontcolor);
        }

        p {
            margin: 0;
        }

        .icon {
            color: #ffffff;
            font-size: 3em;
            opacity: 0.5;
        }

        .iconlinks,
        .iconrechts {

            font-size: calc(var(--infofontsize) * 2.0);
            ;
            color: white;

        }


        .switch1,
        .switch2,
        .switch3,
        .switch4,
        .switch5 {

            flex-direction: row;
            align-items: center;
            justify-content: center;
            margin-top: 0px;
            margin-bottom: 0px;
            margin-left: 10px;
            padding: 5px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            border-width: 0px;
            font-size: var(--switchfontsize);
            box-sizing: border-box;
            height: 100%;
            white-space: nowrap;

        }

        .switch1 {
            background-color: var(--switch1color);

        async function handleMessage(data) {
            const decodedData = JSON.parse(data);

            if (decodedData && decodedData.fullupdate === true) {
                const hide = (id) => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.classList.add('hidden');
                        if (Object.prototype.hasOwnProperty.call(el, 'textContent')) {
                            el.textContent = '';
                        }
                    }
                };
                const hideBtn = (id) => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.classList.add('hidden');
